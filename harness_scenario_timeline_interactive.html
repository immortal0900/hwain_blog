let cur=0,allOpen=false;
function render(){
  const el=document.getElementById('steps');
  el.innerHTML=S.map((s,i)=>{
    const act=allOpen||(i===cur)?'active':'';
    const tagClass=s.tag==='auto'?'tag-auto':s.tag==='wait'?'tag-wait':'tag-interactive';
    const numClass=s.t==='auto'?'auto':s.t==='human'?'human':'gen';
    return `<div class="step ${act}" onclick="toggle(${i})">
      <div class="step-head">
        <div class="step-num ${numClass}">${s.n}</div>
        <div class="step-title">${s.title}</div>
        <span class="step-tag ${tagClass}">${s.tag}</span>
      </div>
      <div class="step-body">${s.body}</div>
    </div>`;
  }).join('');
}
function toggle(i){if(!allOpen){cur=i;render();}}
function next(){if(cur<S.length-1){cur++;allOpen=false;render();}}
function prev(){if(cur>0){cur--;allOpen=false;render();}}
function showAll(){allOpen=!allOpen;render();}
render();
</script>
